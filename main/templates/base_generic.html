<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
      integrity="sha384-b6lVK+yci+bfDmaY1u0zE8YYJt0TZxLEAFyYSLHId4xoVvsrQu3INevFKo+Xir8e"
      crossorigin="anonymous"
    />
    <style>
      input {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px;
      }
      textarea {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px;
      }
      input[type="submit"] {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px;
        background-color: #ccc;
        cursor: pointer;
      }
      input[type="submit"]:hover {
        background-color: #999;
      }
    </style>
    {% block title %}
    <title>Local Library</title>
    {% endblock %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Add additional CSS in static file -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <div class="my-3 mx-6 p-4">
      <div class="mx-auto w-100">
        <div class="col-12 flex my-2 mx-4 flex-row-reverse">
          {% block sidebar %} {% if user.is_authenticated %}
          <p class="mr-3">
            <a
              class="cursor-pointer underline"
              href="{% url 'logout'%}?next={{request.path}}"
              >Logout</a
            >
          </p>
          <p class="mr-3">User: {{ user.get_username }}</p>

          {% else %}
          <p>
            <a
              class="cursor-pointer text-blue underline"
              href="{% url 'login'%}?next={{request.path}}"
              >Login</a
            >
          </p>
          {% endif %} {% endblock %}
        </div>
        <div class="mx-4">{% block content %}{% endblock %}</div>
      </div>
    </div>
  </body>
</html>
